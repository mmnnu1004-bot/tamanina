<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d9488">
  <meta name="description" content="طمأنينة - رفيق القيم والسلوكيات بلغة الإشارة">
  <title>طمأنينة | Tamanina</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#0d9488;--primary-dark:#0f766e;--bg:#f0fdfa;--card:#fff;--text:#1e293b;--muted:#64748b}
    *{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:Cairo,sans-serif;padding-bottom:40px}body.en{font-family:Poppins,sans-serif}
    header{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:18px 20px;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-dark));box-shadow:0 4px 12px #0d948833}
    header h1{font-size:1.25rem}.lang-btn{border:1.5px solid #fff;border-radius:20px;padding:6px 14px;color:#fff;background:#ffffff33;cursor:pointer;font:inherit;font-weight:700}
    .container{max-width:850px;margin:20px auto;padding:0 16px}.tabs{display:flex;gap:10px;overflow-x:auto;margin-bottom:20px;padding-bottom:10px;scrollbar-width:none}.tab-btn{flex:1;min-width:max-content;border:2px solid #cbd5e1;border-radius:12px;padding:10px 18px;background:#fff;color:var(--text);cursor:pointer;font:inherit;font-weight:700}.tab-btn.active{border-color:var(--primary);background:var(--primary);color:#fff}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}.card{display:flex;flex-direction:column;overflow:hidden;border-radius:16px;background:var(--card);box-shadow:0 4px 15px #0000000f}.card img{width:100%;height:200px;object-fit:cover;background:#e2e8f0}.card-body{flex:1;display:flex;flex-direction:column;padding:18px}.badge{width:fit-content;margin-bottom:10px;border-radius:8px;padding:4px 10px;color:var(--primary-dark);background:#ccfbf1;font-size:.78rem;font-weight:700}.card-title{margin-bottom:8px;font-size:1.15rem}.card-desc{flex:1;margin-bottom:18px;color:var(--muted);font-size:.92rem;line-height:1.6}.watch-btn{border:0;border-radius:10px;padding:12px;color:#fff;background:var(--primary);cursor:pointer;font:inherit;font-weight:700}
    .modal{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:16px;background:#0f172ad9}.modal.open{display:flex}.modal-content{width:100%;max-width:700px;overflow:hidden;border-radius:18px;background:#fff}.modal-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #e2e8f0}.close-btn{width:34px;height:34px;border:0;border-radius:50%;color:#ef4444;background:#fee2e2;cursor:pointer;font-size:1.2rem}.video-wrapper{position:relative;height:0;padding-bottom:56.25%;background:#000}.video-wrapper iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.modal-desc{padding:18px;line-height:1.6}
  </style>
</head>
<body>
<header><h1 id="appTitle">رفيق القيم والسلوكيات</h1><button class="lang-btn" id="langBtn" onclick="toggleLanguage()">English</button></header>
<div class="container"><div class="tabs" id="tabsContainer"></div><main class="grid" id="cardsGrid"></main></div>
<div class="modal" id="videoModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()"><div class="modal-header"><h3 id="modalTitle"></h3><button class="close-btn" onclick="closeModal()" aria-label="Close">✕</button></div><div class="video-wrapper"><iframe id="youtubeFrame" title="Sign language lesson" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div><p class="modal-desc" id="modalDesc"></p></div>
</div>
<script>
let lang="ar",selected="all";
const ui={ar:{title:"رفيق القيم والسلوكيات",lang:"English",all:"الكل",watch:"▶ مشاهدة فيديو بلغة الإشارة"},en:{title:"Values & Ethics Companion",lang:"العربية",all:"All",watch:"▶ Watch Sign Language Video"}};
const lessons=[
{id:1,key:"hygiene",section:{ar:"نظافتي وطهارتي",en:"My Hygiene & Purity"},title:{ar:"النظافة الشخصية في الإسلام",en:"Personal Hygiene in Islam"},desc:{ar:"الله يحب النظافة والطهارة. نتعلم أهمية النظافة الشخصية والعناية بالجسم والملابس.",en:"Allah loves cleanliness. Learn about personal hygiene and caring for our body and clothes."},video:"AaLRD2hxkSw",image:"./7.png"},
{id:2,key:"hygiene",section:{ar:"نظافتي وطهارتي",en:"My Hygiene & Purity"},title:{ar:"الوضوء الصحيح خطوة بخطوة",en:"Proper Wudu Step by Step"},desc:{ar:"نتعلم خطوات الوضوء الصحيحة التي تهيئنا للصلاة.",en:"Learn the correct steps of wudu to prepare for prayer."},video:"ZEMfmNbTrc",image:"./6.jpg"},
{id:3,key:"dua",section:{ar:"أدعيتي وطمأنينتي",en:"My Supplications & Peace"},title:{ar:"لماذا ندعو الله؟",en:"Why Do We Pray to Allah?"},desc:{ar:"الدعاء هو حديثنا مع الله، نطلب منه الرحمة والهداية والحماية.",en:"Dua is our conversation with Allah, asking Him for mercy, guidance, and protection."},video:"ZB14uCMykBI",image:"./3.png"},
{id:4,key:"dua",section:{ar:"أدعيتي وطمأنينتي",en:"My Supplications & Peace"},title:{ar:"أذكار الصباح والحماية",en:"Morning Adhkar & Protection"},desc:{ar:"نبدأ يومنا بذكر الله طلبًا للطمأنينة والحماية والسعادة.",en:"Begin your day remembering Allah for reassurance, protection, and happiness."},video:"viBaYQ7TBkY",image:"./8.png"},
{id:5,key:"manners",section:{ar:"أخلاقي وأدبي",en:"My Manners & Conduct"},title:{ar:"أهمية قول السلام",en:"The Importance of Saying Salaam"},desc:{ar:"قول السلام ينشر المحبة والصداقة ويقرب القلوب.",en:"Saying Salaam spreads love and friendship and brings hearts closer."},video:"utGRJI67YXw",image:"./5.jpg"},
{id:6,key:"manners",section:{ar:"أخلاقي وأدبي",en:"My Manners & Conduct"},title:{ar:"احترام الوالدين والمعلمين",en:"Respecting Parents & Teachers"},desc:{ar:"بر الوالدين واحترام المعلمين من أعظم الأخلاق.",en:"Kindness to parents and respect for teachers are among the greatest manners."},video:"iELByqz3sic",image:"./4.png"},
{id:7,key:"worship",section:{ar:"عباداتي وديني",en:"My Worship & Faith"},title:{ar:"الصلاة نور للحياة",en:"Prayer is Light for Life"},desc:{ar:"الصلاة أعظم عبادة بعد الإيمان بالله. نتعلم أركانها ونحافظ عليها.",en:"Prayer is the greatest act of worship after belief in Allah. Learn its pillars and maintain it regularly."},video:"9QgOVSK095c",image:"./2.png"},
{id:8,key:"worship",section:{ar:"عباداتي وديني",en:"My Worship & Faith"},title:{ar:"آداب الأكل والشرب",en:"Etiquette of Eating & Drinking"},desc:{ar:"نبدأ بذكر الله، ونأكل باليد اليمنى، ونحمد الله على نعمه.",en:"Begin by remembering Allah, eat with the right hand, and give thanks for His blessings."},video:"EyTtdFfPA6o",image:"./1.png"}
];
function tabs(){const keys=["all",...new Set(lessons.map(x=>x.key))];document.getElementById("tabsContainer").innerHTML=keys.map(k=>{const x=lessons.find(x=>x.key===k);return `<button class="tab-btn ${selected===k?"active":""}" onclick="filter('${k}')">${k==="all"?ui[lang].all:x.section[lang]}</button>`}).join("")}
function cards(){const data=selected==="all"?lessons:lessons.filter(x=>x.key===selected);document.getElementById("cardsGrid").innerHTML=data.map(x=>`<article class="card"><img src="${x.image}" alt="${x.title[lang]}" loading="lazy"><div class="card-body"><span class="badge">${x.section[lang]}</span><h2 class="card-title">${x.title[lang]}</h2><p class="card-desc">${x.desc[lang]}</p><button class="watch-btn" onclick="openModal(${x.id})">${ui[lang].watch}</button></div></article>`).join("")}
function filter(k){selected=k;tabs();cards()}
function toggleLanguage(){lang=lang==="ar"?"en":"ar";document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";document.body.className=lang==="en"?"en":"";document.getElementById("appTitle").textContent=ui[lang].title;document.getElementById("langBtn").textContent=ui[lang].lang;tabs();cards()}
function openModal(id){const x=lessons.find(x=>x.id===id);if(!x)return;document.getElementById("modalTitle").textContent=x.title[lang];document.getElementById("modalDesc").textContent=x.desc[lang];document.getElementById("youtubeFrame").src=`https://www.youtube-nocookie.com/embed/${x.video}?rel=0`;document.getElementById("videoModal").classList.add("open");document.body.style.overflow="hidden"}
function closeModal(e){if(e&&e.target!==e.currentTarget)return;document.getElementById("videoModal").classList.remove("open");document.getElementById("youtubeFrame").src="";document.body.style.overflow=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
tabs();cards();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
